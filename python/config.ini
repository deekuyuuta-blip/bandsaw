; =============================================================
;  帯鋸 破断予兆 監視ソフト 設定ファイル
;  「;」で始まる行はコメントです。
; =============================================================

[machine]
; 帯鋸の全長 (mm)
blade_length_mm = 8350
; ホイール直径 (mm)
wheel_diameter_mm = 1200
; ホイール回転数の範囲 (rpm)。切削中は負荷で少し下がるので幅を持たせる
wheel_rpm_min = 720
wheel_rpm_max = 830

[input]
; 音の入力元。ffmpeg に渡す入力指定をそのまま書きます。
;  ・カメラ/NVRの音声 (RTSP):  source = rtsp://ユーザー:パスワード@192.168.1.xx:554/xxxx
;  ・Windows のマイク:        source = audio=マイク (USB Audio Device)
;                               input_format = dshow
;  ・録画ファイルの検証:        python bandsaw_monitor.py analyze ファイル名.mp4
source = rtsp://user:pass@192.168.1.100:554/stream1
; dshow (Windowsマイク) / alsa (Linuxマイク) のときだけ指定。RTSPやファイルなら空欄
input_format =
; ffmpeg.exe の場所 (PATHが通っていれば ffmpeg のままでOK)
ffmpeg = ffmpeg

[detect]
; 「カチッ」という打音を拾う周波数帯 (Hz)
band_low_hz = 1500
band_high_hz = 4000
; 1回の判定に使う音の長さ (秒) と判定間隔 (秒)
window_sec = 8.5
hop_sec = 0.5
; これより静かなときは「停止中」とみなして判定しない (dBFS, 打音帯域のレベル)
idle_level_db = -45

[alarm]
; 打音スコア (dB): 帯鋸1周の周波数とその2倍に、周りより何dB鋭い山が出ているか
; 2026/10/27 CAM9 録画での実測 (平常 約8分 / き裂あり 約10分):
;                      平常時        き裂あり (12:59〜13:08 破断)
;   瞬時の最大/中央   10.4 / 約4    25 / 約12
;   30秒平均の最大    5.9           (中央値 11.7)
;   周波数の安定度    0.5 以下      ほぼ 1.0
;
; ■ 注意: 30秒平均が warn_avg_score 以上 かつ 周波数安定度が lock_ratio 以上
; ■ 警報: 30秒平均が alarm_avg_score 以上 (安定度条件あり)
;         または 瞬時スコアが alarm_score 以上を alarm_hold 回連続
avg_sec = 30
warn_avg_score = 8
alarm_avg_score = 11
lock_ratio = 0.7
alarm_score = 14
alarm_hold = 3
; 平常時スコア (learn モードで測った値)。空欄なら運転中に自動学習
baseline_score =
; 瞬時警報は、平常時スコアからこれ以上 上がっていることも条件にする (dB)
min_rise = 4
; 解除: 30秒平均が (warn_avg_score - 3) 未満の状態がこの回数続いたら解除 (240回 = 2分)
clear_hold = 240

[action]
; 発報時に実行するコマンド (空欄なら何もしない)
;  {level} = WARN / ALARM / BREAK,  {score} = スコア,  {time} = 時刻
;  例: パトライトや USB リレー、PLC 入力を動かすスクリプト
command_warn =
command_alarm =
; 発報時に JSON を POST する URL (Teams/Slack/社内システムなど。空欄なら無効)
webhook_url =
; Windows でビープ音を鳴らす (yes/no)
beep = yes
; 発報時に直前の音声を WAV で保存する秒数 (0 で保存しない)
save_audio_sec = 30

[log]
; ログ・保存音声の出力先フォルダ
dir = logs
