name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK をビルド
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK をまとめる
        run: cp android/app/build/outputs/apk/release/app-release.apk bandsaw.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bandsaw-apk
          path: bandsaw.apk

      - name: リリースに置く
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" bandsaw.apk \
            --title "帯鋸打音モニター $TAG" \
            --notes "Android 版。スマホでこのページを開き、bandsaw.apk をダウンロードしてインストールしてください。" \
            --latest
