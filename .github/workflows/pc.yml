name: PC (Windows)

on:
  push:
    branches: [main]
    paths:
      - "pc/**"
      - "android/app/src/main/java/jp/bandsaw/monitor/Core.java"
      - "android/app/src/main/java/jp/bandsaw/monitor/Slmp.java"
      - "android/app/src/main/java/jp/bandsaw/monitor/SlmpServer.java"
      - "android/app/src/main/java/jp/bandsaw/monitor/PlcLink.java"
      - "android/app/src/main/java/jp/bandsaw/monitor/HistoryStore.java"
      - ".github/workflows/pc.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: コンパイル
        shell: bash
        run: |
          set -o pipefail
          M=android/app/src/main/java/jp/bandsaw/monitor
          mkdir -p out build
          if ! javac --release 17 -encoding UTF-8 -d out $M/Core.java $M/Slmp.java $M/SlmpServer.java $M/PlcLink.java $M/HistoryStore.java pc/src/jp/bandsaw/pc/*.java 2>&1 | tee javac.log; then
            grep -E "error" -A3 javac.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          jar --create --file build/bandsaw-pc.jar --main-class jp.bandsaw.pc.Main -C out .

      - name: exe を作る（Java 実行環境込み）
        shell: bash
        run: |
          jpackage --type app-image --name BandsawMonitor --app-version "1.0.${{ github.run_number }}" \
            --vendor bandsaw --description "帯鋸 打音監視" \
            --input build --main-jar bandsaw-pc.jar --main-class jp.bandsaw.pc.Main \
            --icon pc/icon.ico \
            --add-modules java.desktop,java.logging,jdk.charsets,jdk.localedata \
            --jlink-options "--strip-debug --no-header-files --no-man-pages" \
            --java-options "-Dfile.encoding=UTF-8" \
            --dest dist

      - name: ffmpeg（LGPL 版）を同梱
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          $bin = Get-ChildItem -Recurse -Path ff -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path dist/BandsawMonitor/ffmpeg | Out-Null
          Copy-Item $bin.FullName dist/BandsawMonitor/ffmpeg/ffmpeg.exe
          $lic = Get-ChildItem -Recurse -Path ff -Filter LICENSE.txt | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName dist/BandsawMonitor/ffmpeg/LICENSE.txt }
          Copy-Item pc/README_PC.txt dist/BandsawMonitor/使い方.txt
          dist/BandsawMonitor/ffmpeg/ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: zip にまとめる
        shell: pwsh
        run: |
          Compress-Archive -Path dist/BandsawMonitor -DestinationPath bandsaw-pc-win64.zip
          (Get-Item bandsaw-pc-win64.zip).Length

      - uses: actions/upload-artifact@v4
        with:
          name: bandsaw-pc-win64
          path: bandsaw-pc-win64.zip

      - name: リリースに置く（Android 版の latest は変えない）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pc --cleanup-tag -y || true
          gh release create pc bandsaw-pc-win64.zip \
            --title "帯鋸打音モニター PC版 1.0.${{ github.run_number }}" \
            --notes "Windows 版。bandsaw-pc-win64.zip を展開して BandsawMonitor.exe を起動してください（Java 実行環境・ffmpeg 同梱）。" \
            --latest=false
