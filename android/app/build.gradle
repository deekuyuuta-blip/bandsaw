plugins {
    id 'com.android.application'
}

def runNo = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'jp.bandsaw.monitor'
    compileSdk 34

    defaultConfig {
        applicationId 'jp.bandsaw.monitor'
        minSdk 26
        targetSdk 34
        versionCode runNo
        versionName "1.0." + runNo
    }

    // 全ビルドで同じ鍵で署名する（上書きインストールできるように）
    signingConfigs {
        shared {
            storeFile file('bandsaw.keystore')
            storePassword 'bandsaw'
            keyAlias 'bandsaw'
            keyPassword 'bandsaw'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.shared }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
